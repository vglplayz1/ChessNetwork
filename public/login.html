<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#101612"><title>Join Chess Network</title><link rel="stylesheet" href="/theme.css"><style>
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#253a2a 0,transparent 55%),var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif}.auth-shell{width:min(100%,440px);border:1px solid #344638;background:#18211bf2;border-radius:22px;padding:32px;box-shadow:0 25px 90px #0005}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:1px}.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#c5f477;color:#152017;font-size:31px}.brand small{display:block;color:#94a398;font:10px 'DM Mono',monospace;letter-spacing:1.6px;margin-top:4px}.eyebrow{margin-top:30px;color:#c5f477;font:11px 'DM Mono',monospace;letter-spacing:1.7px}h1{font-size:30px;line-height:1.15;letter-spacing:-1px;margin:10px 0}p{color:#94a398;font-size:13px;line-height:1.7;margin:0 0 24px}label{display:block;color:#cbd7ca;font-size:12px;font-weight:700;margin:16px 0 7px}input{width:100%;height:48px;border-radius:10px;border:1px solid #3a4b3d;background:#101612;color:#edf3e9;padding:0 13px;font:inherit;outline:none}input:focus{border-color:#c5f477}button{width:100%;height:48px;margin-top:12px;border:0;border-radius:10px;background:#c5f477;color:#152017;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.secondary{background:transparent;border:1px solid #344638;color:#dce5da}.message{min-height:22px;margin-top:15px;font-size:12px;color:#c5f477;overflow-wrap:anywhere}.message.error{color:#ff8d87}.foot{margin-top:24px;border-top:1px solid #2b392e;padding-top:16px;color:#7f9083;font-size:11px;text-align:center}.foot a{color:#c5f477;text-decoration:none}
</style></head><body><main class="auth-shell"><a class="brand" href="/#play" style="text-decoration:none;color:inherit"><span class="mark">♞</span><span>CHESS NETWORK<small>PLAY · LEARN · IMPROVE</small></span></a><div class="eyebrow">YOUR NEXT GAME STARTS HERE</div><h1 id="title">Create your account.</h1><p id="subtitle">Join the network to find opponents, save your games, and build your chess journey. No password needed.</p><form id="form"><div id="emailWrap"><label for="email">Email address</label><input id="email" type="email" autocomplete="username webauthn" placeholder="you@example.com" required></div><div id="codeWrap" hidden><label for="code">6-digit email code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></div><button id="submit" type="submit">Continue with email →</button><button id="back" class="secondary" type="button" hidden>Use a different email</button></form><section id="passkeyOffer" hidden><button id="addPasskey">Add a passkey</button><button id="skipPasskey" class="secondary">Not now</button></section><div id="message" class="message" role="status" aria-live="polite"></div><div class="foot">Secure sign-in · Email verification · <a href="/#play">Back to chess</a></div></main><script>
(function(){const A=window.hatchable&&window.hatchable.auth,$=id=>document.getElementById(id);let step='email',hasPasskey=false;const declined=()=>{try{return localStorage.getItem('cn_passkey_declined')==='1'}catch(e){return false}};function say(t,err){$('message').textContent=t||'';$('message').classList.toggle('error',!!err)}function done(){location.replace('/#play')}if(!A){say('Account sign-in is loading. Please refresh this page.',true);return}A.getSession().then(s=>{if(s&&s.user)done()}).catch(()=>{});$('back').onclick=()=>{step='email';$('codeWrap').hidden=true;$('emailWrap').hidden=false;$('back').hidden=true;$('submit').textContent='Continue with email →';$('title').textContent='Create your account.';$('subtitle').textContent='Join the network to find opponents, save your games, and build your chess journey. No password needed.';say('')};$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;try{if(step==='email'){const email=$('email').value.trim();if(!email){say('Enter your email address.',true);return}const r=await A.startLogin({email});hasPasskey=!!r.has_passkey;step='code';$('emailWrap').hidden=true;$('codeWrap').hidden=false;$('back').hidden=false;$('submit').textContent='Verify and sign in';$('title').textContent='Check your inbox.';$('subtitle').textContent='Enter the one-time code sent to '+email+'.';$('code').focus();say('Code sent. It expires in 10 minutes.')}else{const r=await A.verifyCode({email:$('email').value.trim(),code:$('code').value.trim()});if(!r||!r.user)throw new Error('That code did not work. Try again.');if(!hasPasskey&&!declined()&&A.supportsPasskeys&&A.supportsPasskeys()&&A.registerPasskey){$('form').hidden=true;$('title').textContent='You’re signed in!';$('subtitle').textContent='Add a passkey for faster sign-in next time, using your fingerprint, face, or screen lock.';$('passkeyOffer').hidden=false;return}done()}}catch(err){say(err&&err.message?err.message:'Could not sign in. Please try again.',true)}finally{$('submit').disabled=false}};$('addPasskey').onclick=async()=>{try{const r=await A.registerPasskey();if(!r)localStorage.setItem('cn_passkey_declined','1');done()}catch(e){say(e.message||'Could not add a passkey. You can continue without one.',true)}};$('skipPasskey').onclick=()=>{try{localStorage.setItem('cn_passkey_declined','1')}catch(e){}done()};})();
</script></body></html>
